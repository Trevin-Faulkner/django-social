apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
        - name: django
          image: jack61318/django-app:__TAG__
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: django-secrets
                optional: true
